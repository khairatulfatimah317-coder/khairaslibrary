<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library - Raraws Magic</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --primary-blue: #00d2ff;
            --book-main: #ff7675; 
            --book-pages: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; color: #ffffff; }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* --- LANDING PAGE --- */
        #gate-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0f172a;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .book-intro {
            position: relative; width: 200px; height: 140px; perspective: 1000px; margin-bottom: 40px;
        }

        .leaf {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%; background: #fff;
            transform-origin: left; border-radius: 0 5px 5px 0; box-shadow: inset 5px 0 10px rgba(0,0,0,0.2);
            animation: openPage 2s forwards ease-in-out;
        }

        .cover-back { position: absolute; width: 100%; height: 100%; background: var(--book-main); border-radius: 5px; }

        @keyframes openPage {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-160deg); background: #f0f0f0; }
        }

        .gate-title { font-size: 36px; font-weight: 800; background: linear-gradient(45deg, #fff, var(--primary-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-enter { margin-top: 30px; padding: 18px 50px; border-radius: 50px; border: 2px solid var(--primary-blue); background: rgba(0, 210, 255, 0.1); color: var(--primary-blue); font-weight: 700; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 3px; }
        .btn-enter:hover { background: var(--primary-blue); color: #000; box-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }
        .gate-hidden { transform: scale(1.5); opacity: 0; visibility: hidden; }

        /* --- MAGIC BOOK CHARACTER --- */
        .char-container { position: fixed; bottom: 40px; right: 50px; z-index: 999; display: flex; flex-direction: column; align-items: center; perspective: 1000px; }
        .chat-bubble { background: white; color: #333; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); position: relative; animation: bounce 2s infinite ease-in-out; }
        .chat-bubble::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid white; }
        .magic-book-v2 { width: 70px; height: 50px; position: relative; transform-style: preserve-3d; animation: bookFly 4s infinite ease-in-out; }
        .book-wing { position: absolute; width: 50%; height: 100%; background: var(--book-main); border: 1px solid rgba(0,0,0,0.1); transform-origin: right center; border-radius: 4px 0 0 4px; }
        .wing-left { left: 0; animation: flapLeft 1.5s infinite ease-in-out; }
        .wing-right { right: 0; transform-origin: left center; border-radius: 0 4px 4px 0; animation: flapRight 1.5s infinite ease-in-out; }
        .pages { position: absolute; width: 40px; height: 40px; background: var(--book-pages); top: 5px; left: 15px; transform: translateZ(-1px); }
        .eye { width: 8px; height: 8px; background: #2d3436; border-radius: 50%; animation: blink 3s infinite; position: absolute; top: 15px; }

        @keyframes flapLeft { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(-40deg); } }
        @keyframes flapRight { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(40deg); } }
        @keyframes bookFly { 0%, 100% { transform: translateY(0) rotateX(20deg); } 50% { transform: translateY(-20px) rotateX(10deg); } }
        @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* --- UI DESIGN --- */
        .header { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass); position: sticky; top: 0; z-index: 100; }
        .title-h1 { margin: 0; font-size: 24px; background: linear-gradient(45deg, #fff, var(--primary-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .controls { display: flex; gap: 15px; align-items: center; }
        .search-box { display: flex; background: rgba(255, 255, 255, 0.1); border-radius: 50px; padding: 5px 15px; border: 1px solid var(--glass); }
        .search-box input { background: none; border: none; padding: 8px; outline: none; width: 200px; color: white; }
        .btn-add { background: var(--primary-blue); color: #000; border: none; padding: 10px 25px; border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; padding-bottom: 100px; }
        .table-box { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border-radius: 30px; padding: 30px; border: 1px solid var(--glass); box-shadow: 0 25px 50px rgba(0,0,0,0.5); overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { text-align: left; padding: 15px; color: var(--primary-blue); border-bottom: 2px solid var(--glass); font-size: 11px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        img.cover { 
            width: 55px; height: 80px; border-radius: 8px; object-fit: cover; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        img.cover:hover { transform: scale(1.4) rotate(8deg); box-shadow: 0 10px 25px rgba(0, 210, 255, 0.6); z-index: 10; }

        .tag-kategori { background: rgba(0, 210, 255, 0.1); border: 1px solid var(--primary-blue); color: var(--primary-blue); padding: 3px 10px; border-radius: 20px; font-size: 11px; }
        .btn-edit { background: none; border: 1px solid var(--primary-blue); color: var(--primary-blue); padding: 4px 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background: none; border: 1px solid #ff4757; color: #ff4757; padding: 4px 12px; border-radius: 6px; cursor: pointer; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter: blur(10px); justify-content:center; align-items:center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 25px; width: 380px; border: 1px solid var(--glass); text-align: center; }
        .modal-content input { width: 100%; margin-bottom: 12px; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
    </style>
</head>
<body>

    <!-- LANDING PAGE -->
    <div id="gate-overlay">
        <div class="book-intro">
            <div class="cover-back"></div>
            <div class="leaf"></div>
            <div class="leaf" style="animation-delay: 0.3s;"></div>
            <div class="leaf" style="animation-delay: 0.6s;"></div>
        </div>
        <h2 class="gate-title">Raraws Library</h2>
        <p style="opacity: 0.7; letter-spacing: 1px; margin-top: 10px;">Temukan koleksi favoritmu ✨</p>
        <button class="btn-enter" onclick="enterApp()">Mulai Eksplorasi</button>
    </div>

    <!-- MAGIC BOOK CHAR -->
    <div class="char-container">
        <div class="chat-bubble" id="bukuSay">Halo, Sobat Literasi! ✨</div>
        <div class="magic-book-v2">
            <div class="book-wing wing-left"><div class="eye" style="left: 10px;"></div></div>
            <div class="book-wing wing-right"><div class="eye" style="right: 10px;"></div></div>
            <div class="pages"></div>
        </div>
    </div>

    <div class="header">
        <div>
            <h1 class="title-h1">📚 Digital Library</h1>
            <p style="margin:0; font-size: 11px; opacity: 0.6;">Katalog, kunci penemu bacaanmu</p>
        </div>
        <div class="controls">
            <div class="search-box">
                <input type="text" id="inputPencarian" placeholder="Cari koleksi...">
                <span style="padding:5px">🔍</span>
            </div>
            <button class="btn-add" onclick="openModal()">+ Tambah</button>
        </div>
    </div>

    <div class="container">
        <div class="table-box">
            <table id="tabelKatalog">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Cover</th>
                        <th>Judul & Penulis</th>
                        <th>Tahun</th>
                        <th>Kategori</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="isiTabel"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--primary-blue);">Tambah Koleksi</h3>
            <input type="hidden" id="editIndex" value="-1">
            <input type="text" id="inpImg" placeholder="URL Link Gambar Cover">
            <input type="text" id="inpJudul" placeholder="Judul Buku">
            <input type="text" id="inpPenulis" placeholder="Nama Penulis">
            <input type="number" id="inpTahun" placeholder="Tahun Terbit">
            <input type="text" id="inpKategori" placeholder="Kategori">
            <button class="btn-add" id="btnSimpan" onclick="simpanData()" style="width: 100%; border-radius: 12px; height: 45px;">Simpan Sekarang</button>
            <p onclick="closeModal()" style="font-size: 13px; margin-top: 15px; cursor: pointer; color: #ff4757;">Batal</p>
        </div>
    </div>

    <script>
        function enterApp() {
            document.getElementById('gate-overlay').classList.add('gate-hidden');
            document.body.style.overflow = 'auto';
        }

        // --- SISTEM DATA (3 Koleksi Awal) ---
        const dataDefault = [
            { img: "https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1732873790i/222072031.jpg", judul: "3726 MDPL", penulis: "Nurwina Sari", tahun: "2024", kategori: "Novel" },
            { img: "https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1680744714i/125467698.jpg", judul: "Malioboro at Midnight", penulis: "Skyphire", tahun: "2023", kategori: "Novel" },
            { img: "https://down-id.img.susercontent.com/file/sg-11134201-22110-b7yqmw7w7ljv00.jpg", judul: "Change Your Habits", penulis: "Isnaeni DK", tahun: "2018", kategori: "Self Dev" }
        ];

        // Cek Memori: Jika kosong, pakai dataDefault. Jika ada, pakai yang tersimpan.
        let koleksiBuku = JSON.parse(localStorage.getItem('myLibrary')) || dataDefault;

        function renderTabel() {
            const tbody = document.getElementById("isiTabel");
            tbody.innerHTML = "";
            koleksiBuku.forEach((buku, index) => {
                let row = tbody.insertRow();
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><img src="${buku.img}" class="cover" onerror="this.src='https://via.placeholder.com/50x70?text=No+Img'"></td>
                    <td>
                        <div style="font-weight: 600; color: var(--primary-blue);">${buku.judul}</div>
                        <div style="font-size: 12px; opacity: 0.6;">${buku.penulis}</div>
                    </td>
                    <td>${buku.tahun}</td>
                    <td><span class="tag-kategori">${buku.kategori || 'Umum'}</span></td>
                    <td>
                        <button class="btn-edit" onclick="editBuku(${index})">Edit</button>
                        <button class="btn-delete" onclick="hapusBuku(${index})">Hapus</button>
                    </td>
                `;
            });
        }

        function simpanData() {
            const index = document.getElementById("editIndex").value;
            const data = {
                img: document.getElementById("inpImg").value,
                judul: document.getElementById("inpJudul").value,
                penulis: document.getElementById("inpPenulis").value,
                tahun: document.getElementById("inpTahun").value,
                kategori: document.getElementById("inpKategori").value
            };

            if(!data.judul || !data.penulis) return alert("Mohon lengkapi judul dan penulis!");

            if (index == "-1") koleksiBuku.push(data);
            else koleksiBuku[index] = data;
            
            localStorage.setItem('myLibrary', JSON.stringify(koleksiBuku));
            renderTabel();
            closeModal();

            const bubble = document.getElementById("bukuSay");
            bubble.innerText = "Wush! Tersimpan! ✨";
            setTimeout(() => { bubble.innerText = "Halo, Sobat Literasi! ✨"; }, 3000);
        }

        function editBuku(index) {
            const buku = koleksiBuku[index];
            document.getElementById("modalTitle").innerText = "Edit Koleksi";
            document.getElementById("editIndex").value = index;
            document.getElementById("inpImg").value = buku.img;
            document.getElementById("inpJudul").value = buku.judul;
            document.getElementById("inpPenulis").value = buku.penulis;
            document.getElementById("inpTahun").value = buku.tahun;
            document.getElementById("inpKategori").value = buku.kategori;
            openModal();
        }

        function hapusBuku(index) {
            if(confirm("Hapus buku ini?")) {
                koleksiBuku.splice(index, 1);
                localStorage.setItem('myLibrary', JSON.stringify(koleksiBuku));
                renderTabel();
            }
        }

        function openModal() { document.getElementById("modal").style.display = "flex"; }
        function closeModal() {
            document.getElementById("modal").style.display = "none";
            document.getElementById("modalTitle").innerText = "Tambah Koleksi";
            document.getElementById("editIndex").value = "-1";
            document.querySelectorAll(".modal-content input").forEach(i => i.value = "");
        }

        document.getElementById("inputPencarian").addEventListener("keyup", function() {
            const val = this.value.toLowerCase();
            const rows = document.querySelectorAll("#isiTabel tr");
            rows.forEach(row => { row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none"; });
        });

        renderTabel();
    </script>
</body>
</html>
